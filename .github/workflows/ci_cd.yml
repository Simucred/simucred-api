name: Simucred CI/CD Pipeline

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "dev", "main", "infra/**", "test/**", "feature/**", "fix/**" ]

jobs:
  # =========================================================================
  # ETAPA 1: CI (Integração Contínua) - Secção 5
  # Roda testes, builda a imagem uma única vez, valida no Compose e exporta
  # =========================================================================
  ci:
    name: "CI - Testes, Build e Validação de Container"
    runs-on: [self-hosted, linux]
    # Sem "services:" aqui! O Docker Compose gerencia todo o stack (postgres,
    # keycloak e api) para evitar conflito de porta 5432 entre o serviço GHA
    # e o container do compose rodando no mesmo host.

    # O CI roda na mesma máquina do deploy: projeto, containers e portas próprios
    # para nunca tocar na aplicação que está no ar (simucred-prod).
    env:
      COMPOSE_PROJECT_NAME: simucred-ci
      CONTAINER_PREFIX: simucred-ci
      API_PORT: 18080
      KEY_PORT: 18081

    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: Limpar containers de execuções anteriores do CI
        run: docker compose down -v --remove-orphans || true

      - name: 2. Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 3. Subir banco para testes (via Docker Compose)
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KEY_USER: ${{ secrets.KEY_USER }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Sobe só o postgres para os testes Maven (sem api/keycloak ainda)
          docker compose up -d postgres
          # Aguarda o healthcheck passar antes de rodar os testes
          docker compose exec -T postgres sh -c \
            'until pg_isready -U $POSTGRES_USER -d $POSTGRES_DB; do sleep 1; done'

      - name: 4. Executar Testes Automatizados (JUnit 5)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: ./mvnw clean test

      - name: 5. Build da Imagem Docker (Sem publicar)
        run: docker build -t app:${{ github.sha }} .

      - name: 6. Validar Imagem subindo com Docker Compose
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KEY_USER: ${{ secrets.KEY_USER }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Sobe todo o backend (postgres já está rodando, compose reutiliza)
          docker compose up -d postgres keycloak api
          sleep 25
          docker compose ps
          docker logs simucred-ci-api
          # Verifica se o container da API continua de pé e saudável
          docker inspect -f '{{.State.Running}}' simucred-ci-api | grep -q "true"

      - name: 7. Guardar imagem validada como artefato para o CD (Regra de Ouro)
        run: docker save --output imagem.tar app:${{ github.sha }}

      - name: 8. Upload do artefato da imagem
        uses: actions/upload-artifact@v4
        with:
          name: imagem-docker-validada
          path: imagem.tar
          retention-days: 1

      # Roda mesmo se algum passo falhar, para não deixar containers do CI na máquina
      - name: Derrubar containers do CI
        if: always()
        run: docker compose down -v --remove-orphans

  # =========================================================================
  # ETAPA 2: CD (Entrega Contínua) - Secções 5, 6 e 7
  # Só roda após o CI passar e apenas na branch principal (main)
  # Reaproveita exatamente os mesmos bytes da imagem testada no CI
  # =========================================================================
  cd:
    name: "CD - Publicação no Docker Hub"
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 1. Download da imagem validada no CI
        uses: actions/download-artifact@v4
        with:
          name: imagem-docker-validada

      - name: 2. Carregar imagem Docker (docker load)
        run: docker load --input imagem.tar

      - name: 3. Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Tag e Push da imagem no Docker Hub
        run: |
          docker tag app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/simucred-api:${{ github.sha }}
          docker tag app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/simucred-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/simucred-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/simucred-api:latest

  # =========================================================================
  # ETAPA 3: Deploy no ambiente local (runner self-hosted)
  # Depois que o CD publica a imagem, sobe a aplicação completa na máquina do
  # runner a partir das imagens do Docker Hub (docker-compose.prod.yml).
  # A aplicação fica acessível em http://localhost:4200 nessa máquina.
  # =========================================================================
  deploy:
    name: "Deploy - Ambiente local (runner)"
    needs: cd
    runs-on: [self-hosted, linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      COMPOSE_PROJECT_NAME: simucred-prod
      CONTAINER_PREFIX: simucred-prod
      # Usa exatamente a imagem publicada neste pipeline (rastreável pelo sha)
      API_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/simucred-api:${{ github.sha }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      KEY_USER: ${{ secrets.KEY_USER }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: 1. Checkout do código (docker-compose.prod.yml e realm do Keycloak)
        uses: actions/checkout@v4

      - name: 2. Baixar as imagens publicadas no Docker Hub
        run: docker compose -f docker-compose.prod.yml pull

      - name: 3. Subir a aplicação
        run: docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: 4. Verificar se a aplicação está respondendo
        run: |
          for i in $(seq 1 30); do
            FRONT=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4200/ || true)
            API=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/v1/simulacoes || true)
            if [ "$FRONT" = "200" ] && [ "$API" = "401" ]; then
              echo "Front respondeu 200 e API respondeu 401 (no ar e protegida) após $((i * 5))s"
              break
            fi
            sleep 5
          done
          docker compose -f docker-compose.prod.yml ps
          curl -sf -o /dev/null http://localhost:4200/
          test "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/v1/simulacoes)" = "401"
          echo "Aplicação no ar: http://localhost:4200"
