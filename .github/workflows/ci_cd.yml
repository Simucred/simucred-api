name: Simucred CI/CD Pipeline

on:
  pull_request:
    branches: ["dev", "main"]
  push:
    branches: ["dev", "main"]

jobs:
  # =========================================================================
  # ETAPA 1: CI (Continuous Integration)
  # =========================================================================
  build-and-test:
    name: "CI - Build e Testes da API"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: simucred_user
          POSTGRES_PASSWORD: simucred_password
          POSTGRES_DB: simucred_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Compilar e Testar a API
        env:
          DB_USER: simucred_user
          DB_PASSWORD: simucred_password
          DB_NAME: simucred_db
          DB_PORT: 5432
        run: mvn clean package

  # =========================================================================
  # ETAPA 2: CD (Continuous Delivery)
  # Só executa se a etapa de CI passar e for um push nas branches dev ou main
  # =========================================================================
  publish-docker-hub:
    name: "CD - Build e Push da Imagem Docker"
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem para o Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/simucred-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/simucred-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
