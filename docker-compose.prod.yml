services:
  postgres:
    image: postgres:16-alpine
    container_name: simucred-db
    environment:
      POSTGRES_DB: ${DB_NAME:-simucred}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - simucred-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-simucred}"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: simucred-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEY_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEY_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
    ports:
      - "${KEY_PORT:-8081}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    networks:
      - simucred-net

  api:
    image: alezzin/simucred-api:latest
    container_name: simucred-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-simucred}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-simucred}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/${KEY_REALM:-simucred}/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - simucred-net

  # Front-end Angular: imagem publicada pelo CD do simucred_web no Docker Hub
  web:
    image: alezzin/simucred-web:latest
    container_name: simucred-web
    ports:
      - "${WEB_PORT:-4200}:4000"
    environment:
      URL_API: http://localhost:${API_PORT:-8080}/v1
      KEYCLOAK_URL: http://localhost:${KEY_PORT:-8081}
      KEYCLOAK_REALM: ${KEY_REALM:-simucred}
      KEYCLOAK_CLIENT_ID: ${KEY_CLIENT_ID:-simucred-web}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - simucred-net

volumes:
  postgres_data:

networks:
  simucred-net:
    driver: bridge