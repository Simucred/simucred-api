spring.application.name=simucred-api

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/simucred

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true

simucred.credito.taxa-juros-mensal=0.025
simucred.credito.percentual-maximo-comprometimento=0.30

# Gemini AI Integration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-1.5-flash}
gemini.api.enabled=${GEMINI_API_ENABLED:true}